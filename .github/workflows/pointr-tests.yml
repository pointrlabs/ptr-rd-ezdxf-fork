name: Pointr fork tests

# The upstream workflows run on master only, which this fork does not use: the
# upstream suite never ran on the fork. This one runs it, with the Pointr tests
# (tests/test_11_pointr) and the listed deliberate deviations
# (pointr_upstream_deviations.txt), on every branch the fork uses.
on:
  push:
    branches: [ develop, 'release/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # what MapScale runs: Python 3.10, pyparsing and numpy pinned in its requirements.txt
        python-version: ['3.10']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools>69.0.0" wheel
        python -m pip install pyparsing==2.4.7 numpy==1.24.4
        python -m pip install --no-build-isolation .
        python -m pip install pytest Pillow
    - name: Test
      run: python -m pytest tests integration_tests
